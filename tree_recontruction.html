    <!-- Visualization & Content Choices: 
        - The Process: Goal=Organize. Method=Interactive horizontal flowchart (HTML/CSS Flexbox). Interaction=Clicking a stage reveals details. Justification=Simplifies the complex reconstruction workflow into digestible steps.

        - Applications: Goal=Inform. Method=Grid of cards with icons. Interaction=Clicking a card opens a modal with details. Justification=Visually engaging way to present real-world use cases.
        - Challenges: Goal=Inform. Method=Accordion UI. Interaction=Click to expand. Justification=Presents dense information concisely.
        - CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

</head>

            function renderPage(page) {
                const pageData = data[page];
                if (!pageData) return;

                document.title = pageData.title;
                mainContent.innerHTML = `<div id="${page}" class="content-section active">${pageData.content}</div>`;
                
                navLinks.forEach(link => {
                    link.classList.toggle('active', link.getAttribute('href') === `#${page}`);
                });

                // Post-render initializations
                if (page === 'process') initProcessFlow();
                if (page === 'comparison') initComparisonDashboard();
                if (page === 'applications') initApplications();
                if (page === 'challenges') initChallenges();
            }
            
            function initProcessFlow() {
                const steps = document.querySelectorAll('.process-step');
                const detailsContainer = document.getElementById('process-details');
                steps.forEach(step => {
                    step.addEventListener('click', () => {
                        const stepId = step.dataset.step;
                        const detailData = data.process.details[stepId];
                        detailsContainer.innerHTML = `
                            <h4 class="text-xl font-bold mb-4">${detailData.title}</h4>
                            ${detailData.content}
                        `;
                        steps.forEach(s => s.classList.remove('bg-gray-200'));
                        step.classList.add('bg-gray-200');
                    });
                });
            }

            function initComparisonDashboard() {
                const methods = data.comparison.methods;
                const cardsContainer = document.getElementById('method-cards');
                const filterButtons = document.querySelectorAll('.filter-btn');
                const resetButton = document.getElementById('reset-filters');
                
                displayMethodCards(methods);
                createComparisonChart(methods.filter(m => m.category === 'Leaf-Filtering'));

                filterButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        button.classList.toggle('active-filter');
                        button.classList.toggle('bg-blue-500');
                        button.classList.toggle('text-white');
                        applyFilters();
                    });
                });

                resetButton.addEventListener('click', () => {
                    filterButtons.forEach(button => {
                        button.classList.remove('active-filter', 'bg-blue-500', 'text-white');
                    });
                    displayMethodCards(methods);
                });
            }

            function applyFilters() {
                const activeFilters = Array.from(document.querySelectorAll('.filter-btn.active-filter')).map(b => b.dataset.filter);
                const allMethods = data.comparison.methods;
                
                if (activeFilters.length === 0) {
                    displayMethodCards(allMethods);
                    return;
                }

                const filteredMethods = allMethods.filter(method => {
                    return activeFilters.every(filter => method.tags.includes(filter));
                });

                displayMethodCards(filteredMethods);
            }

            function displayMethodCards(methods) {
                const cardsContainer = document.getElementById('method-cards');
                if (!cardsContainer) return;
                cardsContainer.innerHTML = '';
                if (methods.length === 0) {
                    cardsContainer.innerHTML = `<p class="text-gray-500 col-span-full text-center">No methods match the selected criteria.</p>`;
                    return;
                }
                methods.forEach(method => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-50 border border-gray-200 p-6 rounded-lg shadow-sm hover:shadow-md transition-shadow';
                    card.innerHTML = `
                        <h4 class="text-xl font-bold mb-2">${method.name}</h4>
                        <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-indigo-600 bg-indigo-200 mb-3">${method.category}</span>
                        <p class="text-sm text-gray-600 mb-3">${method.summary}</p>
                        <div class="text-sm">
                            <p class="mb-1"><strong class="text-green-600">Strengths:</strong> ${method.strengths}</p>
                            <p><strong class="text-red-600">Weaknesses:</strong> ${method.weaknesses}</p>
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                });
            }
            
            function createComparisonChart(chartData) {
                const ctx = document.getElementById('comparisonChart')?.getContext('2d');
                if (!ctx) return;

                if (chartInstance) {
                    chartInstance.destroy();
                }

                const labels = chartData.map(d => d.name);

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Pointwise Accuracy',
                                data: chartData.map(d => d.accuracy),
                                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1,
                                yAxisID: 'y',
                            },
                            {
                                label: 'Volume R²',
                                data: chartData.map(d => d.volume_r2),
                                backgroundColor: 'rgba(75, 192, 192, 0.6)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1,
                                yAxisID: 'y',
                            },
                             {
                                label: 'Processing Time (s/1M points)',
                                data: chartData.map(d => d.speed),
                                backgroundColor: 'rgba(255, 99, 132, 0.6)',
                                borderColor: 'rgba(255, 99, 132, 1)',
                                borderWidth: 1,
                                yAxisID: 'y1',
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Accuracy / R² Value'
                                },
                                max: 1.0
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Processing Time (s)'
                                },
                                grid: {
                                    drawOnChartArea: false, 
                                },
                            }
                        },
                        plugins: {
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            },
                            legend: {
                                position: 'top',
                            }
                        }
                    }
                });
            }

            function initApplications() {
                const appCardsContainer = document.getElementById('app-cards');
                if (!appCardsContainer) return;

                data.applications.cards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'bg-gray-50 p-6 rounded-lg shadow-sm hover:shadow-lg hover:scale-105 transition-all cursor-pointer';
                    cardEl.innerHTML = `
                        <div class="text-4xl mb-3">${card.icon}</div>
                        <h4 class="text-xl font-bold">${card.title}</h4>
                    `;
                    cardEl.addEventListener('click', () => openModal(card.details));
                    appCardsContainer.appendChild(cardEl);
                });
            }
            
            function initChallenges() {
                const accordionContainer = document.getElementById('challenge-accordion');
                if (!accordionContainer) return;
                
                data.challenges.challengesList.forEach(challenge => {
                    const item = document.createElement('div');
                    item.className = 'border border-gray-200 rounded-lg overflow-hidden';
                    item.innerHTML = `
                        <div class="accordion-header p-4 font-semibold cursor-pointer bg-gray-50 hover:bg-gray-100 flex justify-between items-center">
                            <span>${challenge.title}</span>
                            <span class="transform transition-transform text-gray-500">+</span>
                        </div>
                        <div class="accordion-content p-4 bg-white text-gray-600" style="display: none;">
                            ${challenge.content}
                        </div>
                    `;
                    accordionContainer.appendChild(item);

                    const header = item.querySelector('.accordion-header');
                    const content = item.querySelector('.accordion-content');
                    const icon = header.querySelector('span:last-child');

                    header.addEventListener('click', () => {
                        const isVisible = content.style.display === 'block';
                        content.style.display = isVisible ? 'none' : 'block';
                        icon.textContent = isVisible ? '+' : '-';
                    });
                });
            }

            function openModal(content) {
                modalBody.innerHTML = content;
                modalContainer.style.display = 'flex';
            }

            function closeModal() {
                modalContainer.style.display = 'none';
                modalBody.innerHTML = '';
            }

            modalCloseBtn.addEventListener('click', closeModal);
            modalContainer.addEventListener('click', (e) => {
                if (e.target === modalContainer) {
                    closeModal();
                }
            });

            // Initial setup
            const initialPage = window.location.hash.substring(1) || 'overview';
            renderPage(initialPage);

            window.addEventListener('hashchange', () => {
                const newPage = window.location.hash.substring(1) || 'overview';
                renderPage(newPage);
            });
        });
    </script>
</body>
</html>
